name: Release
on:
  push:
    branches:
      - main
concurrency: ${{ github.workflow }}-${{ github.ref }}
permissions:
  contents: write
  pull-requests: write
  id-token: write # Required for OIDC trusted publishing
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # Even though we use bun for install and test runners we still publish using npm.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install
      - run: bun run build
      - run: bun run test
      # This DGB fork does not publish to the upstream @myst-theme npm scope or push
      # to the upstream myst-templates/* repos, so the `publish` input is intentionally
      # omitted here (unlike upstream jupyter-book/myst-theme). This still opens a
      # "Version Packages" PR for changeset bookkeeping, but steps.changesets.outputs.published
      # will never be 'true', which keeps every step/job below gated on it (npm publish,
      # push to myst-templates, auto GitHub release, zip attachment) permanently inert.
      # To publish this theme for books to consume, create a GitHub Release manually -
      # see theme-assets.yml, which attaches book-theme.zip/article-theme.zip to it.
      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@v1
        with:
          version: bun run version
          commit: 🚀 Release
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Notification if a publish happens
        if: steps.changesets.outputs.published == 'true'
        run: echo "A new version of ${GITHUB_REPOSITORY} was published!"
      - name: Configure Git to Push Built Artifacts
        if: steps.changesets.outputs.published == 'true'
        run: |
          git config --global url."https://${{ secrets.MYST_TEMPLATES_USER }}:${{ secrets.MYST_TEMPLATES_TOKEN}}@github.com".insteadOf "https://github.com"
          git config --global user.email "bot@github.com"
          git config --global user.name "MyST Theme Bot"
      - name: Deploy Book
        if: steps.changesets.outputs.published == 'true'
        run: make deploy-book
      - name: Deploy Article
        if: steps.changesets.outputs.published == 'true'
        run: make deploy-article

  # Grab the tag from package.json so we know how to tag the github release
  get-tag:
    name: Get Tag Name
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.get_tag.outputs.tag_name }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Determine tag from myst-to-react package.json
        id: get_tag
        run: |
          VERSION=$(jq -r '.version' packages/myst-to-react/package.json)
          if [ -z "$VERSION" ]; then
            echo "Unable to read version from packages/myst-to-react/package.json" >&2
            exit 1
          fi
          TAG="myst-to-react@$VERSION"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"

  # Trigger a github release workflow only if we've published
  release-github:
    name: Publish GitHub Release
    needs:
      - release
      - get-tag
    if: ${{ needs.release.outputs.published == 'true' }}
    uses: ./.github/workflows/publish-github-release.yml
    with:
      tag_name: ${{ needs.get-tag.outputs.tag_name }}
    secrets: inherit

  # Attach the book and article theme zips to the release we just created
  attach-theme-assets:
    name: Attach theme assets to release
    needs:
      - release
      - get-tag
      - release-github
    if: ${{ needs.release.outputs.published == 'true' }}
    uses: ./.github/workflows/theme-assets.yml
    with:
      tag_name: ${{ needs.get-tag.outputs.tag_name }}
    secrets: inherit
